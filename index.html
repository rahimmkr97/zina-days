<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d6d">
<meta name="description" content="Zina's Days: IBS food and symptom log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

<title>Zina's Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: one calm column, app-style tabs pinned at the bottom like a phone app; flips fully for Arabic */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --ink:#1d2b27; --muted:#5d6d68; --line:#dbe4e0;
  --accent:#2f7d6d; --accent-soft:#dcefe9; --plum:#7a4a78;
  --good:#2f8a4f; --good-bg:#e1f3e7; --mid:#a8740f; --mid-bg:#fbf0d6; --bad:#b3413a; --bad-bg:#f9e2df;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[lang="ar"]{--display:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; --body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121916; --surface:#1b2420; --ink:#e4ece8; --muted:#9db0a9; --line:#2c3833;
  --accent:#6cc3ad; --accent-soft:#1f3a33; --plum:#d0a0cd;
  --good:#7fd29a; --good-bg:#1b3324; --mid:#e8bf62; --mid-bg:#3a2f15; --bad:#f09088; --bad-bg:#3d201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121916; --surface:#1b2420; --ink:#e4ece8; --muted:#9db0a9; --line:#2c3833;
  --accent:#6cc3ad; --accent-soft:#1f3a33; --plum:#d0a0cd;
  --good:#7fd29a; --good-bg:#1b3324; --mid:#e8bf62; --mid-bg:#3a2f15; --bad:#f09088; --bad-bg:#3d201d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
main{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:2rem;font-weight:700;letter-spacing:-.01em}
:root[lang="ar"] h1{letter-spacing:0}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:500}
:root[lang="ar"] h3{font-weight:700}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top>div:first-child{min-width:0;flex:1 1 220px}
.lede{color:var(--muted);margin-top:6px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
:root[lang="ar"] .eyebrow{letter-spacing:0;font-size:.85rem}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);gap:2px}
.langs button{font:inherit;font-size:.85rem;font-weight:600;border:0;background:none;color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;min-width:44px}
.langs button[lang="ar"]{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
section{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.q{font-weight:600;font-size:.95rem;display:block;margin-bottom:6px}
.hint{font-size:.85rem;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:64px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{font:inherit;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.scale button small{font-size:.7rem;color:var(--muted)}
.scale button[aria-pressed="true"]{border-color:var(--plum);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--plum)}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500;padding:8px 12px}
.toast{color:var(--good);font-weight:600;font-size:.9rem;min-height:1.2em}
.toast.err{color:var(--bad)}
.entry{border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.entry:first-child{border-top:0;padding-top:0}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;grid-row:span 3}
.d-low{background:var(--good-bg);color:var(--good)}.d-mid{background:var(--mid-bg);color:var(--mid)}.d-high{background:var(--bad-bg);color:var(--bad)}
.entry .when{font-size:.8rem;color:var(--muted)}
.entry .what{min-width:0;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--plum);border:1px solid var(--plum);border-radius:6px;padding:0 6px;margin-inline-start:6px}
.insight{background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.lanes{display:grid;grid-template-columns:1fr;gap:8px}
.lane{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.lane.g{background:var(--good-bg)}.lane.a{background:var(--mid-bg)}.lane.r{background:var(--bad-bg)}
.lane.g h3{color:var(--good)}.lane.a h3{color:var(--mid)}.lane.r h3{color:var(--bad)}
.lane ul{margin:0;padding-inline-start:18px;columns:2;column-gap:20px}
.lane li{break-inside:avoid;font-size:.95rem;margin-bottom:2px}
@media (max-width:420px){.lane ul{columns:1}}
.tips{display:flex;flex-direction:column;gap:14px}
.tip{display:grid;grid-template-columns:28px 1fr;gap:2px 10px}
.tip .n{font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.1rem;grid-row:span 2}
.tip p{color:var(--muted);font-size:.95rem}
.dish .n{width:10px;height:10px;border-radius:50%;background:var(--plum);margin-top:.5em}
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 16px}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--accent-soft),var(--accent));transform:scale(.6);transition:transform 4s ease-in-out;display:grid;place-items:center;color:var(--surface);font-family:var(--display);font-weight:700;font-size:1.1rem}
.redflags{border:2px solid var(--bad);background:var(--bad-bg);border-radius:14px;padding:16px}
.redflags ul{margin:8px 0 0;padding-inline-start:20px}
.redflags h2{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav button{font:inherit;font-size:.8rem;font-weight:600;background:none;border:0;color:var(--muted);padding:10px 4px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button[aria-selected="true"]{color:var(--accent)}
.foot{font-size:.8rem;color:var(--muted)}
.quick{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--good-bg);border-radius:14px;padding:14px 16px}
.quick p{font-weight:600;color:var(--good);min-width:0}
.btn.good{background:var(--good);color:var(--surface)}
.more summary{cursor:pointer;font-weight:600;color:var(--accent);padding-block:4px}
.more-body{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.entry{position:relative;padding-inline-end:76px}
.del{position:absolute;inset-inline-end:0;top:12px;font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 8px;cursor:pointer}
.entry:first-child .del{top:0}
.del.sure{color:var(--bad);border-color:var(--bad)}
.checks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks:empty{display:none}
.chk{display:grid;grid-template-columns:10px auto 1fr;gap:2px 8px;align-items:baseline;font-size:.9rem}
.cdot{width:10px;height:10px;border-radius:50%;background:var(--line);align-self:center}
.chk.g .cdot{background:var(--good)}.chk.a .cdot{background:var(--mid)}.chk.r .cdot{background:var(--bad)}.chk.x .cdot,.chk.u .cdot{background:var(--muted)}
.chk.p .cdot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.cname{font-weight:600;min-width:0;overflow-wrap:anywhere}
.clvl{color:var(--muted)}.chk.g .clvl{color:var(--good)}.chk.a .clvl{color:var(--mid)}.chk.r .clvl{color:var(--bad)}
.cnote{grid-column:2/-1;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){.chk.p .cdot{animation:none}}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mid);margin-inline-end:6px;vertical-align:middle}
.sync[data-s="syncOn"]::before{background:var(--good)}
.sync[data-s="syncRO"]::before,.sync[data-s="syncErr"]::before{background:var(--bad)}
@media (prefers-reduced-motion:reduce){.orb{transition:none}}
</style>
</head>
<body>

<main>
  <header class="top">
    <div>
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1>Zina's Days</h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button data-l="en" lang="en">EN</button>
      <button data-l="fr" lang="fr">FR</button>
      <button data-l="ar" lang="ar">عربي</button>
    </div>
  </header>

  <!-- LOG -->
  <section id="v-log">
    <div class="quick">
      <p id="quickMsg" data-t="quickQ" aria-live="polite"></p>
      <button class="btn good" id="goodDay" data-t="goodDay"></button>
    </div>
    <div class="panel">
      <h2 data-t="howToday"></h2>
      <div><span class="q" data-t="painQ"></span><div class="scale" id="pain" role="group"></div></div>
      <div><span class="q" data-t="symQ"></span><div class="chips" id="sym"></div></div>
      <div><span class="q" data-t="stoolQ"></span><div class="chips" id="stool"></div></div>
      <div>
        <label class="q" for="ate" data-t="ateQ"></label>
        <div class="chips" id="foodChips" style="margin-bottom:10px"></div>
        <input type="text" id="ate" autocomplete="off">
        <ul class="checks" id="checks" aria-live="polite"></ul>
        <p class="hint" data-t="ateHint" style="margin-top:6px"></p>
      </div>
      <details class="more">
        <summary data-t="moreQ"></summary>
        <div class="more-body">
          <div><span class="q" data-t="stressQ"></span><div class="chips" id="stress"></div></div>
          <div><label class="q" for="note" data-t="noteQ"></label><textarea id="note"></textarea></div>
        </div>
      </details>
      <button class="btn" id="save" data-t="save"></button>
      <p class="toast" id="toast" aria-live="polite"></p>
    </div>
    <div class="insight" id="insight"></div>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h2 data-t="recent"></h2>
        <button class="btn ghost" id="clearEx" data-t="removeEx" hidden></button>
      </div>
      <div id="list" style="display:flex;flex-direction:column;gap:12px"></div>
      <p class="foot sync" id="sync"></p>
      <p class="foot" data-t="listFoot"></p>
    </div>
  </section>

  <!-- FOODS -->
  <section id="v-food" hidden>
    <div><h2 data-t="foodH"></h2><p class="lede" data-t="foodLede"></p></div>
    <input type="text" id="q" aria-label="Search">
    <div class="lanes" id="lanes"></div>
    <div class="panel"><h3 data-t="dishH"></h3><div class="tips" id="dishes"></div></div>
    <p class="foot" data-t="foodFoot"></p>
  </section>

  <!-- RELIEF -->
  <section id="v-relief" hidden>
    <div><h2 data-t="reliefH"></h2><p class="lede" data-t="reliefLede"></p></div>
    <div class="panel"><h3 data-t="mixH"></h3><div class="tips" id="mixed"></div></div>
    <div class="panel breath">
      <h3 data-t="breathH"></h3>
      <div class="orb" id="orb"></div>
      <p class="hint" data-t="breathP" style="text-align:center"></p>
      <button class="btn" id="bbtn"></button>
    </div>
    <div class="panel"><div class="tips" id="relief"></div></div>
    <div class="panel"><h3 data-t="familyH"></h3><div class="tips" id="family"></div></div>
  </section>

</main>

<nav role="tablist">
  <button role="tab" data-v="log" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span data-t="navLog"></span></button>
  <button role="tab" data-v="food" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4"/></svg><span data-t="navFood"></span></button>
  <button role="tab" data-v="relief" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span data-t="navRelief"></span></button>
</nav>

dishes:{
en:[["Chorba frik","Fry garlic in the oil, take it out, and cook with that oil. Use the green tops of spring onion instead of onion. A few rinsed canned chickpeas. One bowl, not three."],["Couscous","A small plate with plenty of carrot, courgette and potato, with chicken or lamb. Leave onion out of the sauce and keep the chickpeas few."],["Chakchouka","Tomatoes, peppers and eggs are all fine. Just use garlic oil instead of garlic and onion."],["Tajine zitoune","Chicken, olives and carrots are good. Leave out onion and mushrooms."],["Loubia and adess","Bean and lentil stews are strong triggers. Try a small portion of rinsed canned lentils, or have a meat and potato stew instead."],["Ramadan","Break the fast with one date and water, then a light chorba. Go easy on zlabia and fried bourek."],["Spices","Cumin, coriander, paprika, ginger, turmeric and cinnamon are fine. Check that ras el hanout has no garlic or onion powder."]],
fr:[["Chorba frik","Faites revenir l'ail dans l'huile, retirez-le, et cuisinez avec cette huile. Utilisez le vert de l'oignon nouveau à la place de l'oignon. Quelques pois chiches en boîte rincés. Un bol, pas trois."],["Couscous","Une petite assiette avec beaucoup de carottes, courgettes et pommes de terre, avec poulet ou agneau. Pas d'oignon dans la sauce et peu de pois chiches."],["Chakchouka","Tomates, poivrons et œufs sont bien tolérés. Remplacez simplement l'ail et l'oignon par l'huile à l'ail."],["Tajine zitoune","Poulet, olives et carottes conviennent. Retirez l'oignon et les champignons."],["Loubia et adès","Les plats de haricots et de lentilles déclenchent souvent. Essayez une petite portion de lentilles en boîte rincées, ou préférez un ragoût de viande et pommes de terre."],["Ramadan","Rompez le jeûne avec une datte et de l'eau, puis une chorba légère. Modérez la zlabia et le bourek frit."],["Épices","Cumin, coriandre, paprika, gingembre, curcuma et cannelle conviennent. Vérifiez que le ras el hanout ne contient pas d'ail ni d'oignon en poudre."]],
ar:[["شوربة الفريك","اقلي الثوم في الزيت ثم أخرجيه واطبخي بذلك الزيت. استعملي الجزء الأخضر من البصل الأخضر بدل البصل. قليل من الحمص المعلّب المغسول. صحن واحد فقط."],["الكسكسي","صحن صغير مع كثير من الجزر والقرعة والبطاطا، ودجاج أو لحم غنم. بدون بصل في المرق، وقلّلي الحمص."],["الشكشوكة","الطماطم والفلفل والبيض كلها مناسبة. فقط استعملي زيت الثوم بدل الثوم والبصل."],["طاجين الزيتون","الدجاج والزيتون والجزر مناسبة. اتركي البصل والفطر."],["اللوبيا والعدس","من أقوى المسببات. جربي كمية صغيرة من العدس المعلّب المغسول، أو مرق اللحم بالبطاطا بدلاً منها."],["رمضان","افطري بتمرة واحدة وماء، ثم شوربة خفيفة. قلّلي من الزلابية والبوراك المقلي."],["التوابل","الكمون والكسبر والفلفل الأحمر والزنجبيل والكركم والقرفة مناسبة. تأكدي أن رأس الحانوت لا يحتوي على مسحوق الثوم أو البصل."]]},
relief:{

en:[["IBS and endometriosis often go together","Many women with endometriosis also have IBS, and gut symptoms can continue after surgery. The food guide and relief tips are the right place to start. If your symptoms change, mention it at your next visit."],["Endometriosis can feel like IBS","Endometriosis near the bowel also causes bloating, cramps and bowel changes, and many women have both. Tell the gynaecologist about the gut symptoms."],["Watch for a monthly pattern","If the ovaries were kept, hormones still follow a monthly cycle even without periods. If symptoms come back at the same time each month, show the log to the gynaecologist."],["If the ovaries were removed","Hot flushes, poor sleep and mood changes can start. Ask the gynaecologist which hormone treatment is safe after endometriosis."]],
fr:[["Côlon irritable et endométriose vont souvent ensemble","Beaucoup de femmes atteintes d'endométriose ont aussi un côlon irritable, et les symptômes digestifs peuvent continuer après l'opération. Le guide alimentaire et les conseils de soulagement sont le bon point de départ. Si vos symptômes changent, signalez-le à la prochaine consultation."],["L'endométriose peut ressembler au côlon irritable","L'endométriose près de l'intestin provoque aussi ballonnements, crampes et troubles du transit, et beaucoup de femmes ont les deux. Parlez des symptômes digestifs au gynécologue."],["Repérez un rythme mensuel","Si les ovaires ont été gardés, les hormones suivent encore un cycle mensuel, même sans règles. Si les symptômes reviennent à la même période chaque mois, montrez le journal au gynécologue."],["Si les ovaires ont été retirés","Bouffées de chaleur, mauvais sommeil et sautes d'humeur peuvent apparaître. Demandez au gynécologue quel traitement hormonal convient après une endométriose."]],
ar:[["القولون العصبي وبطانة الرحم المهاجرة يأتيان معاً كثيراً","كثير من النساء المصابات ببطانة الرحم المهاجرة لديهن أيضاً قولون عصبي، وأعراض البطن قد تستمر بعد العملية. دليل الأطعمة ونصائح الراحة هي نقطة البداية المناسبة. إذا تغيّرت الأعراض، أخبري الطبيب في الزيارة القادمة."],["بطانة الرحم المهاجرة قد تشبه القولون العصبي","عندما تكون قرب الأمعاء تسبب أيضاً انتفاخاً وتقلصات وتغيّراً في الإخراج، وكثير من النساء لديهن الاثنان معاً. أخبري طبيب النساء بأعراض البطن."],["لاحظي إن كان هناك نمط شهري","إذا بقي المبيضان، تستمر الهرمونات في دورة شهرية حتى بدون حيض. إذا عادت الأعراض في نفس الوقت كل شهر، اعرضي السجل على طبيب النساء."],["إذا تمت إزالة المبيضين","قد تبدأ الهبات الساخنة وقلة النوم وتقلّب المزاج. اسألي طبيب النساء عن العلاج الهرموني المناسب بعد بطانة الرحم المهاجرة."]]};
TIPS.mixed={
en:[["Psyllium helps both sides","Soluble fibre (psyllium) firms loose stool and softens hard stool. Start with 1 teaspoon a day in a big glass of water and increase slowly over 2–3 weeks. Avoid wheat bran."],["On loose days","Small plain meals: rice, potatoes, eggs, firm banana. Cut down on coffee and fried or fatty food, and drink water. Ask the doctor before taking anti-diarrhoea medicine, because with mixed IBS it can swing you into constipation."],["On hard days","Drink more water, take a walk, and try 2 kiwis a day. Don't strain; raising your feet on a small stool helps. Ask the doctor before taking laxatives, because they can swing you into diarrhoea."],["Keep a steady rhythm","Eat at regular times and don't skip meals. Give yourself unhurried time in the toilet after breakfast."]],
fr:[["Le psyllium aide dans les deux cas","Les fibres solubles (psyllium) raffermissent les selles molles et ramollissent les selles dures. Commencez par 1 cuillère à café par jour dans un grand verre d'eau, et augmentez doucement sur 2 à 3 semaines. Évitez le son de blé."],["Les jours de selles molles","Petits repas simples : riz, pommes de terre, œufs, banane peu mûre. Réduisez le café et les aliments frits ou gras, et buvez de l'eau. Demandez au médecin avant de prendre un anti-diarrhéique, car avec un côlon irritable mixte il peut provoquer une constipation."],["Les jours de selles dures","Buvez plus d'eau, marchez, et essayez 2 kiwis par jour. Ne poussez pas ; surélever les pieds sur un petit tabouret aide. Demandez au médecin avant de prendre un laxatif, car il peut provoquer une diarrhée."],["Gardez un rythme régulier","Mangez à heures fixes et ne sautez pas de repas. Prenez le temps d'aller aux toilettes sans vous presser après le petit-déjeuner."]],
ar:[["بزر القطونة يساعد في الحالتين","الألياف الذائبة (بزر القطونة أو السيليوم) تجعل البراز الليّن أكثر تماسكاً والبراز الصلب أكثر ليونة. ابدئي بملعقة صغيرة يومياً في كأس ماء كبير، وزيدي ببطء خلال 2–3 أسابيع. تجنّبي نخالة القمح."],["في أيام الإسهال","وجبات صغيرة وبسيطة: أرز، بطاطا، بيض، موز غير ناضج كثيراً. قلّلي القهوة والمقلي والدسم، واشربي الماء. اسألي الطبيب قبل أخذ دواء ضد الإسهال، لأنه مع القولون المختلط قد يسبب الإمساك."],["في أيام الإمساك","اشربي ماء أكثر، امشي قليلاً، وجربي حبتي كيوي يومياً. لا تضغطي؛ رفع القدمين على كرسي صغير يساعد. اسألي الطبيب قبل أخذ مليّن، لأنه قد يسبب الإسهال."],["حافظي على إيقاع منتظم","كلي في أوقات ثابتة ولا تتركي الوجبات. خذي وقتك في الحمام بدون استعجال بعد الفطور."]]};

/* ---------- Entries & sync ----------
   Symptoms, stool, stress and meal are stored as keys so they read in any language.
   serverEntries = what the online store holds (cached on the phone);
   pend = new entries not yet confirmed online; gutdays-del = deletions not yet confirmed. */
const LEG={Bloating:'bloat',Cramps:'cramps',Gas:'gas',Diarrhoea:'diar',Constipation:'const',Urgency:'urg',Nausea:'naus',Tired:'tired'};
const LEGS={Low:'low',Medium:'med',High:'high'};
const day=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString()};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const getJ=(k,d)=>{try{const v=JSON.parse(ls.get(k)||'null');return v==null?d:v}catch(e){return d}};
const setJ=(k,v)=>ls.set(k,JSON.stringify(v));
let serverEntries=getJ('gutdays',[]).filter(e=>!e.ex);
let pend=getJ('gutdays-pend',[]);
const legacy=serverEntries.filter(e=>!e.id);
if(legacy.length){
  pend=pend.concat(legacy.map(e=>({...e,id:newId(),syms:(e.syms||[]).map(s=>LEG[s]||s),stress:LEGS[e.stress]||e.stress||'low'})));
  serverEntries=serverEntries.filter(e=>e.id);setJ('gutdays-pend',pend);setJ('gutdays',serverEntries);
}
const examples=()=>[
{t:day(1),pain:3,syms:['bloat','cramps'],stool:'hard',meal:'dinner',exi:0,stress:'high',note:'',ex:true},
{t:day(2),pain:1,syms:['gas'],stool:'normal',meal:'lunch',exi:1,stress:'low',note:'',ex:true},
{t:day(3),pain:3,syms:['bloat','diar'],stool:'loose',meal:'lunch',exi:2,stress:'med',note:'',ex:true}];
let entries=[];
function compute(){
  const dels=getJ('gutdays-del',[]);const sIds=new Set(serverEntries.map(e=>e.id));
  const real=[...serverEntries.filter(e=>!dels.includes(e.id)),...pend.filter(e=>!sIds.has(e.id)&&!dels.includes(e.id))];
  entries=real.length||ls.get('gutdays-noex')?real:examples();
}
compute();
const ateOf=e=>e.ex?EX_ATE[e.exi][lang]:(e.ate||'');

let db=null,syncState='syncWait',flushing=false,blocked=false;
function setSync(s){syncState=s;const el=$('#sync');el.dataset.s=s;el.textContent=t(s)}
async function flush(){
  if(!db||flushing||blocked)return;flushing=true;
  try{
    for(const e of [...pend]){
      try{await db.collection('entries').doc(e.id).set(e);pend=pend.filter(x=>x.id!==e.id);setJ('gutdays-pend',pend)}
      catch(err){blocked=true;setSync(err&&err.code==='invalid_argument'?'syncRO':'syncErr');return}
    }
    for(const id of getJ('gutdays-del',[])){
      try{await db.collection('entries').doc(id).delete();setJ('gutdays-del',getJ('gutdays-del',[]).filter(x=>x!==id))}
      catch(err){blocked=true;setSync(err&&err.code==='invalid_argument'?'syncRO':'syncErr');return}
    }
  }finally{flushing=false}
}
async function initSync(){
  setSync('syncWait');
  let d=null;
  try{d=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){}
  if(!d){setSync('syncOff');return}
  db=d;
  db.collection('foods').limit(1000).get().then(s=>{
    s.docs.forEach(doc=>{const v=doc.data();if(v&&v.name&&v.lvl){const n=norm(v.name);FC[n]={lvl:v.lvl,notes:{...((FC[n]&&FC[n].notes)||{}),...(v.notes||{})}}}});
    setJ('gutdays-foods',FC);renderChecks();
  }).catch(()=>{});
  db.collection('entries').orderBy('t','desc').limit(1000).onSnapshot(snap=>{
    serverEntries=snap.docs.map(s=>({...s.data(),id:s.id}));
    setJ('gutdays',serverEntries);
    compute();renderList();buildFoodChips();
    if(syncState==='syncWait')setSync('syncOn');
    flush();
  },()=>{if(syncState==='syncWait')setSync('syncOff')});
}
function addEntry(e){
  e.id=newId();e.t=new Date().toISOString();
  pend.push(e);setJ('gutdays-pend',pend);
  compute();renderList();buildFoodChips();flush();
}
function removeEntry(id){
  pend=pend.filter(x=>x.id!==id);setJ('gutdays-pend',pend);
  if(serverEntries.some(x=>x.id===id)){const dl=getJ('gutdays-del',[]);dl.push(id);setJ('gutdays-del',dl)}
  compute();renderList();buildFoodChips();flush();
}

const hashId=s=>{let h=5381;for(const c of s)h=(Math.imul(h,33)^c.codePointAt(0))>>>0;return 'f'+h.toString(36)};

const LOCAL_KEYS=Object.keys(LOCAL).filter(k=>k.length>1).sort((a,b)=>b.length-a.length);
const RANK={r:4,a:3,x:2,u:1,g:0};
function lookup(f){
  const n=norm(f);if(!n)return null;
  for(const v of [n,n+'s',n.replace(/s$/,''),n.replace(/es$/,'')]){if(FC[v])return FC[v];if(LOCAL[v])return LOCAL[v]}
  // A dish or phrase: find the known foods inside it (longest first) and report the worst one.
  let s=' '+n+' ';const hits=[];
  for(const k of LOCAL_KEYS){if(s.includes(' '+k+' ')){hits.push(k);s=s.split(' '+k+' ').join('  ')}}
  if(!hits.length)return null;
  const worst=hits.reduce((w,k)=>RANK[LOCAL[k].lvl]>RANK[LOCAL[w].lvl]?k:w,hits[0]);
  if(hits.length===1)return LOCAL[worst];
  const lvl=LOCAL[worst].lvl,bad=hits.filter(k=>LOCAL[k].lvl===lvl);
  return {lvl,notes:{[lang]:lvl==='g'?'':t('contains')+' '+bad.join(lang==='ar'?'، ':', ')}};
}

async function askFoodApi(names){
  const r=await fetch(window.FOOD_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({foods:names,lang})});
  if(!r.ok)throw {code:r.status===429?'rate_limited':'upstream_error'};
  return r.json();
}
let sampleFn,sampleOff=false,busy=false;
const LNAME={en:'English',fr:'French',ar:'simple Arabic'};
const foodPrompt=names=>`You help a woman in Algeria who has mixed-type IBS follow the Monash University low-FODMAP approach.
For each food or dish below (written in English, French, Arabic or Algerian Darija, in Latin or Arabic script), give:
- "level": "g" if low-FODMAP in a normal portion, "a" if fine only in a small portion, "r" if high-FODMAP or a common IBS trigger, "x" if it depends on the recipe or variety, "u" if it is not a food or you cannot tell.
- "note": at most 12 words in ${LNAME[lang]}: the safe portion, or the main trigger (for example garlic, onion, lactose, wheat, fat).
Foods: ${JSON.stringify(names)}
Reply with only a JSON array with one object per food, in the same order: [{"food":"...","level":"g","note":"..."}]`;
function saveFood(n,lvl,note){
  const notes={...((FC[n]&&FC[n].notes)||{})};if(note)notes[lang]=note;
  FC[n]={lvl,notes};setJ('gutdays-foods',FC);
  if(db)db.collection('foods').doc(hashId(n)).set({name:n,lvl,notes}).catch(()=>{});
}
function rowHTML(f){
  const r=lookup(f),n=norm(f);
  const L={g:t('lanes').g[0],a:t('lanes').a[0],r:t('lanes').r[0],x:t('lvlX'),u:t('lvlU')};
  let cls='p',label='',note='';
  if(r){cls=r.lvl;label=L[r.lvl]||'';note=(r.notes&&r.notes[lang])||''}
  else if(checking.has(n))label=t('checking');
  else if(netFail.has(n)){cls='u';label=t('noNet')}
  else if(failed.has(n)){cls='u';label=t('lvlU')}
  return `<li class="chk ${cls}"><span class="cdot"></span><span class="cname">${esc(f)}</span><span class="clvl">${esc(label)}</span>${note?`<span class="cnote">${esc(note)}</span>`:''}</li>`;
}

  const box=$('#checks');if(box)box.innerHTML=splitFoods($('#ate').value).map(rowHTML).join('');

}
async function checkNames(list){
  const names=[...new Set(list.map(norm))].filter(n=>n&&!lookup(n)&&!failed.has(n)&&!checking.has(n)).slice(0,12);
  if(!names.length){renderChecks();return}
  if(busy){names.forEach(n=>queued.add(n));return}
  busy=true;names.forEach(n=>netFail.delete(n));
  if(sampleFn===undefined){try{sampleFn=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){sampleFn=null}}
  if((!sampleFn&&!window.FOOD_API)||sampleOff){names.forEach(n=>failed.add(n));busy=false;renderChecks();return}
  names.forEach(n=>checking.add(n));renderChecks();
  let netErr=false;
  try{
    const res=sampleFn?await sampleFn.json(foodPrompt(names),{modelTier:'quick'}):await askFoodApi(names);
    (Array.isArray(res)?res:[]).forEach((r,i)=>{
      const n=names[i];if(!n||!r||typeof r!=='object')return;
      const lvl=['g','a','r','x','u'].includes(r.level)?r.level:'u';
      saveFood(n,lvl,String(r.note||'').slice(0,160));
    });
  }catch(e){
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e&&e.code))sampleOff=true;
    else netErr=true;
  }finally{
    names.forEach(n=>{checking.delete(n);if(!lookup(n))(netErr?netFail:failed).add(n)});
    busy=false;renderChecks();
    if(queued.size){const q=[...queued];queued.clear();checkNames(q)}
  }
}

function buildFoodChips(){
  const counts={};
  entries.filter(e=>!e.ex).forEach(e=>splitFoods(e.ate||'').forEach(f=>{const k=f.toLowerCase();counts[k]=(counts[k]||0)+1}));
  const mine=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const list=[...new Set([...mine.slice(0,10),...t('defFoods')])].slice(0,16);
  const box=$('#foodChips');box.innerHTML='';
  list.forEach(f=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=f;
    b.onclick=()=>{const items=splitFoods($('#ate').value);const i=items.findIndex(x=>x.toLowerCase()===f.toLowerCase());
      if(i>=0)items.splice(i,1);else items.push(f);
      $('#ate').value=items.join(lang==='ar'?'، ':', ');syncFoodChips();checkFoods()};
    box.append(b)});

}

      const b=document.createElement('button');b.type='button';b.className='del';b.textContent=t('del');
      b.onclick=()=>{
        if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent=t('delSure');setTimeout(()=>{b.classList.remove('sure');b.textContent=t('del')},4000);return}
        removeEntry(e.id)};
      el.append(b);
    }
    list.append(el);
  });
  $('#clearEx').hidden=!entries.some(e=>e.ex);
  insight();
}

function insight(){
  const bad={},good={};
  entries.forEach(e=>ateOf(e).split(/[,،]/).map(f=>f.trim().toLowerCase()).filter(Boolean).forEach(f=>{const m=e.pain>=3?bad:good;m[f]=(m[f]||0)+1}));
  const sus=Object.entries(bad).filter(([f,n])=>n>=(good[f]||0)+1).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
  const box=$('#insight');
  if(entries.length<3){box.innerHTML=`<h3>${t('patterns')}</h3><p class="hint">${t('patternsEmpty')}</p>`;return}
  box.innerHTML=`<h3>${t('badFoods')}</h3><p>${sus.length?sus.map(esc).join(lang==='ar'?'، ':', '):t('nothing')}</p><p class="hint">${t('clue')}</p>`;
}

function drawFoods(){
  const q=$('#q').value.trim().toLowerCase();const i=LI[lang];
  $('#lanes').innerHTML=Object.entries(FOODS).map(([k,arr])=>{
    const it=arr.filter(x=>!q||x.join(' ').toLowerCase().includes(q));
    if(q&&!it.length)return'';
    const [h,d]=t('lanes')[k];
    return `<div class="lane ${k}"><h3>${h}</h3><p class="hint">${d}</p><ul>${it.map(x=>`<li>${esc(x[i])}</li>`).join('')}</ul></div>`;
  }).join('')||`<p class="hint">${t('notFound')}</p><ul class="checks" id="qcheck"></ul><button class="btn ghost" id="qbtn" type="button">${t('checkBtn')}</button>`;
  const qb=$('#qbtn');if(qb)qb.onclick=()=>checkNames([$('#q').value]);
  renderChecks();
}

function tips(sel,list,numbered,cls=''){
  $(sel).innerHTML=list.map(([h,p],i)=>`<div class="tip ${cls}">${numbered?`<span class="n">${i+1}</span>`:'<span class="n"></span>'}<strong>${esc(h)}</strong><p>${esc(p)}</p></div>`).join('');
}

/* ---------- Apply language ---------- */
function applyLang(){
  const root=document.documentElement;
  root.lang=lang;root.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  $('#note').placeholder=t('notePh');$('#q').placeholder=t('searchPh');
  if(!timer){$('#orb').textContent=t('start');$('#bbtn').textContent=t('start')}else{$('#bbtn').textContent=t('stop')}
  tips('#dishes',TIPS.dishes[lang],false,'dish');
  tips('#relief',TIPS.relief[lang],true);
  tips('#family',TIPS.family[lang],true);
  tips('#mixed',TIPS.mixed[lang],true);
  buildForm();renderList();drawFoods();
  $('#toast').textContent='';
  setSync(syncState);
}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;ls.set('gutdays-lang',lang);applyLang()});

/* Tabs */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['log','food','relief'].forEach(v=>$('#v-'+v).hidden=v!==b.dataset.v);
  window.scrollTo(0,0);
});

/* Save */
$('#save').onclick=()=>{
  const toast=$('#toast');
  if(pain===null){toast.className='toast err';toast.textContent=t('pickPain');return}
  addEntry({pain,syms:[...picked],stool,ate:$('#ate').value.trim(),stress,note:$('#note').value.trim()});
  pain=null;picked.clear();stress='low';stool=null;meal=null;$('#ate').value='';$('#note').value='';
  buildForm();
  toast.className='toast';toast.textContent=t('saved');
  setTimeout(()=>toast.textContent='',3000);
};
$('#goodDay').onclick=()=>{
  addEntry({pain:0,syms:[],stool:'normal',ate:'',stress:'low',note:'',meal:'day'});
  $('#quickMsg').textContent=t('goodSaved');
  setTimeout(()=>$('#quickMsg').textContent=t('quickQ'),3000);
};
$('#clearEx').onclick=()=>{ls.set('gutdays-noex','1');compute();renderList();buildFoodChips()};
$('#q').oninput=drawFoods;
$('#ate').oninput=()=>{syncFoodChips();if(/[,،]\s*$/.test($('#ate').value))checkFoods()};
$('#ate').onchange=checkFoods;

/* Breathing */
let timer=null;
$('#bbtn').onclick=()=>{
  const orb=$('#orb');
  if(timer){clearTimeout(timer);timer=null;orb.style.transform='scale(.6)';orb.textContent=t('start');$('#bbtn').textContent=t('start');return}
  $('#bbtn').textContent=t('stop');
  const inn=()=>{orb.style.transitionDuration='4s';orb.style.transform='scale(1)';orb.textContent=t('inn');timer=setTimeout(out,4000)};
  const out=()=>{orb.style.transitionDuration='6s';orb.style.transform='scale(.6)';orb.textContent=t('out');timer=setTimeout(inn,6000)};
  inn();
};

applyLang();
initSync();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
